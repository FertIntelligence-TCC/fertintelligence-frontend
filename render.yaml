services:
  - type: web
    runtime: static
    name: fertintelligence-client
    branch: m-fertilization
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://fertintelligence-api.onrender.com
      - key: VITE_IMAGE_MANAGER_URL
        value: https://fertintelligence-image-api.onrender.com
      - key: VITE_FERT_AI_API_URL
        value: https://fertintelligence-fert-ai.onrender.com
